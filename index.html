<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BHARAT AI</title>
<style>
*{box-sizing:border-box}
body{
margin:0;
font-family:Arial,Helvetica,sans-serif;
background:#f5f7fb;
color:#202124;
height:100vh;
overflow:hidden
}
.header{
height:70px;
background:white;
border-bottom:1px solid #e2e5ea;
display:flex;
align-items:center;
justify-content:space-between;
padding:0 28px;
position:relative;
z-index:5
}
.logo{
font-size:25px;
font-weight:800;
letter-spacing:.5px
}
.logo span{font-size:14px;font-weight:500;color:#777;margin-left:8px}
.header-right{display:flex;align-items:center;gap:10px}
.status{
font-size:13px;
padding:8px 12px;
border-radius:20px;
background:#edf7ed;
color:#267326
}
.main{
height:calc(100vh - 70px);
display:flex;
flex-direction:column
}
.chat{
flex:1;
overflow-y:auto;
padding:30px 18px 150px
}
.welcome{
max-width:900px;
margin:45px auto 25px;
text-align:center
}
.welcome h1{
font-size:42px;
margin:0 0 12px
}
.welcome p{
font-size:17px;
color:#666;
margin:0
}
.messages{
max-width:900px;
margin:auto
}
.message{
display:flex;
margin:18px 0;
gap:12px
}
.message.user{justify-content:flex-end}
.avatar{
width:38px;
height:38px;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
font-weight:bold;
flex-shrink:0;
background:#e8edf7
}
.message.user .avatar{background:#202124;color:white;order:2}
.bubble{
max-width:75%;
padding:14px 17px;
border-radius:18px;
line-height:1.55;
white-space:pre-wrap;
word-wrap:break-word
}
.message.assistant .bubble{
background:white;
border:1px solid #e3e6eb;
border-top-left-radius:5px
}
.message.user .bubble{
background:#202124;
color:white;
border-top-right-radius:5px
}
.typing{
display:inline-flex;
gap:4px;
align-items:center
}
.dot{
width:6px;
height:6px;
background:#777;
border-radius:50%;
animation:blink 1.2s infinite
}
.dot:nth-child(2){animation-delay:.2s}
.dot:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,100%{opacity:.25}50%{opacity:1}}
.composer-wrap{
position:fixed;
bottom:0;
left:0;
right:0;
background:linear-gradient(transparent,#f5f7fb 22%);
padding:30px 18px 20px;
z-index:4
}
.composer{
max-width:900px;
margin:auto;
background:white;
border:1px solid #dfe3e8;
border-radius:22px;
padding:10px;
box-shadow:0 5px 25px rgba(0,0,0,.08)
}
.input-row{
display:flex;
align-items:flex-end;
gap:8px
}
textarea{
flex:1;
border:0;
outline:0;
resize:none;
font:16px Arial;
padding:13px;
min-height:48px;
max-height:150px;
background:transparent
}
button{
border:0;
cursor:pointer;
font-weight:600
}
.icon-btn{
width:44px;
height:44px;
border-radius:50%;
background:#f0f2f5;
font-size:19px
}
.send{
width:46px;
height:46px;
border-radius:50%;
background:#202124;
color:white;
font-size:18px
}
.send:disabled{opacity:.45;cursor:not-allowed}
.file-info{
display:none;
font-size:13px;
color:#555;
padding:5px 12px 8px
}
.file-info.active{display:block}
.tools{
display:flex;
justify-content:space-between;
align-items:center;
padding:6px 7px 2px
}
.tool-left{display:flex;gap:6px}
.hidden{display:none}
.quick{
max-width:900px;
margin:0 auto 15px;
display:flex;
justify-content:center;
gap:8px;
flex-wrap:wrap
}
.quick button{
background:white;
border:1px solid #ddd;
padding:9px 13px;
border-radius:18px;
font-weight:400
}
.quick button:hover{background:#f0f2f5}
.error{
background:#fff1f1!important;
border-color:#ffcaca!important;
color:#9b2222
}
@media(max-width:650px){
.header{padding:0 15px}
.logo{font-size:21px}
.status{display:none}
.welcome h1{font-size:32px}
.bubble{max-width:86%}
.chat{padding-top:15px}
}
</style>
</head>

<body>

<header class="header">
<div class="logo">BHARAT AI <span>Study Tutor</span></div>
<div class="header-right">
<div class="status" id="status">● Online</div>
</div>
</header>

<main class="main">

<section class="chat" id="chat">
<div class="welcome" id="welcome">
<h1>Learn • Ask • Understand</h1>
<p>Your AI study tutor for questions, explanations and learning.</p>
</div>
<div class="messages" id="messages"></div>
</section>

<div class="composer-wrap">

<div class="quick" id="quick">
<button onclick="quickAsk('Explain this topic in simple words.')">Explain simply</button>
<button onclick="quickAsk('Give me a step-by-step explanation.')">Step by step</button>
<button onclick="quickAsk('Quiz me on this topic.')">Quiz me</button>
</div>

<div class="composer">

<div class="file-info" id="fileInfo"></div>

<div class="input-row">
<button class="icon-btn" id="fileBtn" title="Upload file">＋</button>

<textarea id="question" rows="1" placeholder="Ask BHARAT AI anything..."></textarea>

<button class="icon-btn" id="micBtn" title="Voice input">🎙</button>

<button class="send" id="sendBtn" title="Send">➤</button>
</div>

<div class="tools">
<div class="tool-left">
<span style="font-size:12px;color:#777;padding:10px">BHARAT AI</span>
</div>
<span style="font-size:11px;color:#999">AI can make mistakes. Check important answers.</span>
</div>

</div>

</div>

<input class="hidden" type="file" id="fileInput" accept=".pdf,.txt,.doc,.docx,.png,.jpg,.jpeg">

</main>

<script>
const question=document.getElementById("question");
const sendBtn=document.getElementById("sendBtn");
const micBtn=document.getElementById("micBtn");
const fileBtn=document.getElementById("fileBtn");
const fileInput=document.getElementById("fileInput");
const fileInfo=document.getElementById("fileInfo");
const messages=document.getElementById("messages");
const welcome=document.getElementById("welcome");
const chat=document.getElementById("chat");
const quick=document.getElementById("quick");
const status=document.getElementById("status");

let selectedFile=null;
let recognition=null;
let speaking=false;

function scrollBottom(){
chat.scrollTo({top:chat.scrollHeight,behavior:"smooth"});
}

function addMessage(text,type="assistant",error=false){
welcome.style.display="none";
quick.style.display="none";

const row=document.createElement("div");
row.className="message "+type;

const avatar=document.createElement("div");
avatar.className="avatar";
avatar.textContent=type==="user"?"You":"B";

const bubble=document.createElement("div");
bubble.className="bubble"+(error?" error":"");
bubble.textContent=text;

row.appendChild(avatar);
row.appendChild(bubble);
messages.appendChild(row);
scrollBottom();

return bubble;
}

function addTyping(){
welcome.style.display="none";
quick.style.display="none";

const row=document.createElement("div");
row.className="message assistant";
row.id="typing";

const avatar=document.createElement("div");
avatar.className="avatar";
avatar.textContent="B";

const bubble=document.createElement("div");
bubble.className="bubble";

const typing=document.createElement("span");
typing.className="typing";

for(let i=0;i<3;i++){
const d=document.createElement("span");
d.className="dot";
typing.appendChild(d);
}

bubble.appendChild(typing);
row.appendChild(avatar);
row.appendChild(bubble);
messages.appendChild(row);
scrollBottom();
}

function removeTyping(){
const t=document.getElementById("typing");
if(t)t.remove();
}

async function ask(text=null){
const value=(text!==null?text:question.value).trim();

if(!value && !selectedFile)return;

if(value)addMessage(value,"user");

question.value="";
question.style.height="48px";
sendBtn.disabled=true;
addTyping();

try{
let response;

if(selectedFile){
const form=new FormData();
form.append("file",selectedFile);
form.append("question",value);

response=await fetch("/ask",{
method:"POST",
body:form
});
}else{
response=await fetch("/ask",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({question:value})
});
}

let data={};

try{
data=await response.json();
}catch(e){
throw new Error("The server returned an invalid response.");
}

removeTyping();

if(!response.ok){
throw new Error(data.error||data.message||"The AI server returned an error.");
}

const answer=data.answer||data.response||data.text||"I couldn't generate an answer.";

addMessage(answer,"assistant");
speak(answer);

}catch(error){
removeTyping();
addMessage("Sorry, I couldn't connect to BHARAT AI.\n\n"+error.message,"assistant",true);
status.textContent="● Server error";
status.style.background="#fff1f1";
status.style.color="#a11";
}finally{
sendBtn.disabled=false;
}
}

function quickAsk(text){
question.value=text;
ask();
}

sendBtn.addEventListener("click",()=>ask());

question.addEventListener("keydown",e=>{
if(e.key==="Enter"&&!e.shiftKey){
e.preventDefault();
ask();
}
});

question.addEventListener("input",()=>{
question.style.height="48px";
question.style.height=Math.min(question.scrollHeight,150)+"px";
});

fileBtn.addEventListener("click",()=>fileInput.click());

fileInput.addEventListener("change",()=>{
selectedFile=fileInput.files[0]||null;

if(selectedFile){
fileInfo.textContent="📎 "+selectedFile.name;
fileInfo.classList.add("active");
}else{
fileInfo.textContent="";
fileInfo.classList.remove("active");
}
});

function speak(text){
if(!("speechSynthesis" in window))return;

speechSynthesis.cancel();

const utterance=new SpeechSynthesisUtterance(text);
utterance.rate=.95;
utterance.pitch=1;
utterance.volume=1;

const voices=speechSynthesis.getVoices();

const preferred=voices.find(v=>
/en-IN|hi-IN/i.test(v.lang)
)||voices.find(v=>
/Google|Microsoft/i.test(v.name)
);

if(preferred)utterance.voice=preferred;

speechSynthesis.speak(utterance);
}

function startVoice(){
const SpeechRecognition=
window.SpeechRecognition||
window.webkitSpeechRecognition;

if(!SpeechRecognition){
alert("Voice input is not supported by this browser. Try a recent Chrome or Edge browser.");
return;
}

if(recognition){
recognition.stop();
recognition=null;
micBtn.textContent="🎙";
return;
}

recognition=new SpeechRecognition();
recognition.lang="en-IN";
recognition.interimResults=false;
recognition.continuous=false;

recognition.onstart=()=>{
micBtn.textContent="🔴";
status.textContent="● Listening";
};

recognition.onresult=e=>{
const transcript=e.results[0][0].transcript;
question.value+=(question.value?" ":"")+transcript;
question.dispatchEvent(new Event("input"));
};

recognition.onerror=()=>{
status.textContent="● Online";
micBtn.textContent="🎙";
};

recognition.onend=()=>{
recognition=null;
micBtn.textContent="🎙";
status.textContent="● Online";
};

recognition.start();
}

micBtn.addEventListener("click",startVoice);

window.addEventListener("load",()=>{
setTimeout(()=>{
if("speechSynthesis" in window)speechSynthesis.getVoices();
},300);
});

async function checkServer(){
try{
const r=await fetch("/health",{method:"GET"});
if(r.ok){
status.textContent="● Online";
status.style.background="#edf7ed";
status.style.color="#267326";
}else{
status.textContent="● Server issue";
}
}catch(e){
status.textContent="● Connecting";
}
}

checkServer();
setInterval(checkServer,30000);
</script>

</body>
</html>
