<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BHARAT AI</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: #f7f7f8;
    color: #202123;
}

header {
    height: 70px;
    background: white;
    border-bottom: 1px solid #e5e5e5;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 28px;
    position: sticky;
    top: 0;
    z-index: 10;
}

.logo {
    display: flex;
    align-items: center;
    gap: 12px;
}

.logo h1 {
    margin: 0;
    font-size: 25px;
    font-weight: 700;
    letter-spacing: -0.5px;
}

.subtitle {
    color: #777;
    font-size: 14px;
}

.status {
    display: flex;
    align-items: center;
    gap: 7px;
    font-size: 13px;
    color: #555;
}

.status-dot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: #22c55e;
}

#chat {
    width: min(1000px, calc(100% - 30px));
    margin: 0 auto;
    padding: 35px 0 150px;
}

.welcome {
    text-align: center;
    margin-top: 70px;
    color: #555;
}

.welcome h2 {
    font-size: 32px;
    margin-bottom: 10px;
    color: #202123;
}

.welcome p {
    font-size: 16px;
}

.message {
    display: flex;
    margin: 22px 0;
    gap: 12px;
}

.avatar {
    width: 34px;
    height: 34px;
    min-width: 34px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: bold;
    font-size: 14px;
}

.ai-avatar {
    background: #e9eefc;
    color: #3155c7;
}

.user-avatar {
    background: #202123;
    color: white;
}

.bubble {
    max-width: 82%;
    padding: 14px 17px;
    border-radius: 16px;
    line-height: 1.55;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
}

.ai-bubble {
    background: white;
    border: 1px solid #e5e5e5;
}

.user-bubble {
    background: #202123;
    color: white;
    margin-left: auto;
}

.user-message {
    justify-content: flex-end;
}

.user-message .user-avatar {
    order: 2;
}

.user-message .bubble {
    order: 1;
}

.error-bubble {
    background: #fff4f4;
    border: 1px solid #f0caca;
    color: #8b2525;
}

.typing {
    display: inline-flex;
    gap: 5px;
    align-items: center;
}

.typing span {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #888;
    animation: blink 1.2s infinite;
}

.typing span:nth-child(2) {
    animation-delay: .15s;
}

.typing span:nth-child(3) {
    animation-delay: .3s;
}

@keyframes blink {
    0%, 60%, 100% {
        opacity: .25;
    }
    30% {
        opacity: 1;
    }
}

.composer-area {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    background: linear-gradient(
        transparent,
        #f7f7f8 25%
    );
    padding: 25px 15px 18px;
}

.composer {
    width: min(900px, 100%);
    margin: auto;
    background: white;
    border: 1px solid #d9d9d9;
    border-radius: 18px;
    box-shadow: 0 4px 20px rgba(0,0,0,.08);
    padding: 10px;
}

.input-row {
    display: flex;
    align-items: flex-end;
    gap: 8px;
}

textarea {
    flex: 1;
    border: none;
    resize: none;
    outline: none;
    font-family: inherit;
    font-size: 16px;
    min-height: 48px;
    max-height: 150px;
    padding: 12px;
    line-height: 1.4;
}

.icon-button {
    width: 42px;
    height: 42px;
    border: none;
    border-radius: 50%;
    background: #f0f0f0;
    cursor: pointer;
    font-size: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
}

.icon-button:hover {
    background: #e4e4e4;
}

.send-button {
    width: 44px;
    height: 44px;
    border: none;
    border-radius: 50%;
    background: #202123;
    color: white;
    cursor: pointer;
    font-size: 18px;
}

.send-button:hover {
    background: #000;
}

.send-button:disabled {
    opacity: .45;
    cursor: not-allowed;
}

.file-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 7px 8px 2px;
    font-size: 12px;
    color: #777;
}

.file-name {
    flex: 1;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

.clear-button {
    border: none;
    background: transparent;
    color: #777;
    cursor: pointer;
    font-size: 12px;
}

.clear-button:hover {
    color: #222;
}

input[type="file"] {
    display: none;
}

.notice {
    text-align: center;
    font-size: 11px;
    color: #888;
    margin-top: 8px;
}

@media (max-width: 600px) {
    header {
        padding: 0 15px;
    }

    .subtitle {
        display: none;
    }

    #chat {
        width: calc(100% - 20px);
    }

    .bubble {
        max-width: 90%;
    }

    .welcome h2 {
        font-size: 25px;
    }
}
</style>
</head>

<body>

<header>
    <div class="logo">
        <h1>BHARAT AI</h1>
        <span class="subtitle">Study Tutor</span>
    </div>

    <div class="status">
        <span class="status-dot"></span>
        <span>Online</span>
    </div>
</header>

<main id="chat">

    <div class="welcome" id="welcome">
        <h2>How can I help you study?</h2>
        <p>Ask BHARAT AI a question in English, Hindi or Hinglish.</p>
    </div>

</main>

<div class="composer-area">

    <div class="composer">

        <div class="input-row">

            <label class="icon-button" title="Upload study material">
                +
                <input
                    type="file"
                    id="fileInput"
                    accept=".txt,.pdf,.docx"
                >
            </label>

            <textarea
                id="question"
                placeholder="Ask BHARAT AI anything..."
                rows="1"
            ></textarea>

            <button
                class="icon-button"
                id="micButton"
                title="Voice input"
                type="button"
            >
                🎙
            </button>

            <button
                class="send-button"
                id="sendButton"
                title="Send"
                type="button"
            >
                ➤
            </button>

        </div>

        <div class="file-row" id="fileRow" style="display:none;">
            <span>📄</span>
            <span class="file-name" id="fileName"></span>
            <button
                class="clear-button"
                id="clearButton"
                type="button"
            >
                Clear
            </button>
        </div>

    </div>

    <div class="notice">
        BHARAT AI can make mistakes. Check important answers.
    </div>

</div>

<script>
const questionBox = document.getElementById("question");
const sendButton = document.getElementById("sendButton");
const chat = document.getElementById("chat");
const welcome = document.getElementById("welcome");
const fileInput = document.getElementById("fileInput");
const fileRow = document.getElementById("fileRow");
const fileName = document.getElementById("fileName");
const clearButton = document.getElementById("clearButton");
const micButton = document.getElementById("micButton");

let busy = false;

function addMessage(text, type, error = false) {

    if (welcome) {
        welcome.style.display = "none";
    }

    const wrapper = document.createElement("div");
    wrapper.className = "message";

    if (type === "user") {
        wrapper.classList.add("user-message");
    }

    const avatar = document.createElement("div");
    avatar.className =
        "avatar " +
        (type === "user" ? "user-avatar" : "ai-avatar");

    avatar.textContent = type === "user" ? "You" : "B";

    const bubble = document.createElement("div");

    bubble.className =
        "bubble " +
        (type === "user" ? "user-bubble" : "ai-bubble");

    if (error) {
        bubble.classList.add("error-bubble");
    }

    bubble.textContent = text;

    wrapper.appendChild(avatar);
    wrapper.appendChild(bubble);

    chat.appendChild(wrapper);

    window.scrollTo({
        top: document.body.scrollHeight,
        behavior: "smooth"
    });

    return wrapper;
}

function addTyping() {

    if (welcome) {
        welcome.style.display = "none";
    }

    const wrapper = document.createElement("div");
    wrapper.className = "message";
    wrapper.id = "typingMessage";

    const avatar = document.createElement("div");
    avatar.className = "avatar ai-avatar";
    avatar.textContent = "B";

    const bubble = document.createElement("div");
    bubble.className = "bubble ai-bubble";

    const typing = document.createElement("div");
    typing.className = "typing";

    typing.innerHTML =
        "<span></span><span></span><span></span>";

    bubble.appendChild(typing);
    wrapper.appendChild(avatar);
    wrapper.appendChild(bubble);

    chat.appendChild(wrapper);

    window.scrollTo({
        top: document.body.scrollHeight,
        behavior: "smooth"
    });
}

function removeTyping() {
    const element = document.getElementById("typingMessage");

    if (element) {
        element.remove();
    }
}

async function sendQuestion() {

    if (busy) {
        return;
    }

    const question = questionBox.value.trim();

    if (!question) {
        return;
    }

    busy = true;
    sendButton.disabled = true;

    addMessage(question, "user");

    questionBox.value = "";
    questionBox.style.height = "48px";

    addTyping();

    try {

        const response = await fetch("/ask", {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                "Accept": "application/json"
            },
            body: JSON.stringify({
                question: question
            })
        });

        const contentType =
            response.headers.get("content-type") || "";

        const rawText = await response.text();

        removeTyping();

        if (!response.ok) {

            let errorMessage = rawText;

            if (contentType.includes("application/json")) {
                try {
                    const errorData = JSON.parse(rawText);

                    errorMessage =
                        errorData.answer ||
                        errorData.message ||
                        rawText;
                } catch (e) {
                }
            }

            if (!errorMessage) {
                errorMessage =
                    "The server returned an error. HTTP " +
                    response.status;
            }

            addMessage(
                "Server error (" +
                response.status +
                "):\n\n" +
                errorMessage,
                "ai",
                true
            );

            return;
        }

        let data;

        if (contentType.includes("application/json")) {

            try {
                data = JSON.parse(rawText);
            } catch (e) {

                addMessage(
                    "BHARAT AI returned invalid JSON:\n\n" +
                    rawText,
                    "ai",
                    true
                );

                return;
            }

        } else {

            addMessage(
                "The server returned a non-JSON response:\n\n" +
                rawText,
                "ai",
                true
            );

            return;
        }

        if (data.answer) {

            addMessage(
                String(data.answer),
                "ai"
            );

        } else {

            addMessage(
                "BHARAT AI returned an unexpected response:\n\n" +
                JSON.stringify(data, null, 2),
                "ai",
                true
            );
        }

    } catch (error) {

        removeTyping();

        addMessage(
            "Could not connect to BHARAT AI.\n\n" +
            error.message,
            "ai",
            true
        );

    } finally {

        busy = false;
        sendButton.disabled = false;
        questionBox.focus();
    }
}

sendButton.addEventListener("click", sendQuestion);

questionBox.addEventListener("keydown", function(event) {

    if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        sendQuestion();
    }

});

questionBox.addEventListener("input", function() {

    this.style.height = "48px";

    this.style.height =
        Math.min(this.scrollHeight, 150) + "px";

});

fileInput.addEventListener("change", async function() {

    const file = this.files[0];

    if (!file) {
        return;
    }

    fileName.textContent = file.name;
    fileRow.style.display = "flex";

    const formData = new FormData();
    formData.append("file", file);

    try {

        fileName.textContent =
            file.name + " — uploading...";

        const response = await fetch("/upload", {
            method: "POST",
            body: formData
        });

        const contentType =
            response.headers.get("content-type") || "";

        const rawText = await response.text();

        let data = null;

        if (contentType.includes("application/json")) {
            try {
                data = JSON.parse(rawText);
            } catch (e) {
                data = null;
            }
        }

        if (!response.ok) {

            addMessage(
                "Upload error:\n\n" +
                (data?.message || rawText),
                "ai",
                true
            );

            return;
        }

        fileName.textContent =
            data?.message ||
            file.name + " uploaded successfully.";

    } catch (error) {

        addMessage(
            "Could not upload the file.\n\n" +
            error.message,
            "ai",
            true
        );
    }

});

clearButton.addEventListener("click", async function() {

    try {

        const response = await fetch("/clear", {
            method: "POST",
            headers: {
                "Accept": "application/json"
            }
        });

        const rawText = await response.text();

        let data = null;

        try {
            data = JSON.parse(rawText);
        } catch (e) {
        }

        fileInput.value = "";
        fileRow.style.display = "none";
        fileName.textContent = "";

        addMessage(
            data?.message ||
            "Study material cleared.",
            "ai"
        );

    } catch (error) {

        addMessage(
            "Could not clear the study material.\n\n" +
            error.message,
            "ai",
            true
        );
    }

});

const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

if (SpeechRecognition) {

    const recognition = new SpeechRecognition();

    recognition.continuous = false;
    recognition.interimResults = false;
    recognition.lang = "en-IN";

    micButton.addEventListener("click", function() {

        try {
            recognition.start();
            micButton.textContent = "🔴";
        } catch (error) {
        }

    });

    recognition.onresult = function(event) {

        const transcript =
            event.results[0][0].transcript;

        questionBox.value =
            questionBox.value
                ? questionBox.value + " " + transcript
                : transcript;

        questionBox.dispatchEvent(
            new Event("input")
        );

    };

    recognition.onend = function() {
        micButton.textContent = "🎙";
    };

    recognition.onerror = function() {
        micButton.textContent = "🎙";
    };

} else {

    micButton.style.display = "none";
}

fetch("/health")
    .then(response => response.json())
    .then(data => {
        console.log("BHARAT AI health:", data);
    })
    .catch(error => {
        console.log("Health check failed:", error);
    });
</script>

</body>
</html>
